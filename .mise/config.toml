min_version = "2026.11.1"

[tools]
go = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.10.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
"github:oxc-project/oxc" = { version = "0.79.0", version_prefix = "oxfmt_v", matching_regex = "^oxfmt-", rename_exe = "oxfmt" }
zizmor = "1.33.1"

[tasks.fmt]
description = "Run go fmt against code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet against code"
run = "go vet ./..."

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with coverage"
run = "go test $(go list ./...) -coverprofile cover.out"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[hooks]
postinstall = "lefthook install"
